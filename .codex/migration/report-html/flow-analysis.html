<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流程分析</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div id="hero"></div>
    <section class="panel">
      <div class="controls">
        <input id="q" placeholder="搜索流程名/步骤/API/状态变化..." />
        <select id="domain">
          <option value="all">全部业务域</option>
          <option value="CONV">CONV</option>
          <option value="INBOX">INBOX</option>
          <option value="CRM">CRM</option>
          <option value="AUTO">AUTO</option>
          <option value="CMP">CMP</option>
          <option value="HC">HC</option>
          <option value="CAPTAIN">CAPTAIN</option>
          <option value="ACL">ACL</option>
          <option value="ASYNC">ASYNC</option>
          <option value="AUTH">AUTH</option>
        </select>
      </div>
      <div id="stats" class="muted"></div>
    </section>

    <section class="panel">
      <h3>交互流程（页面点击链路）</h3>
      <div id="interaction" class="flow-grid"></div>
    </section>

    <section class="panel">
      <h3>业务操作流程（端到端业务闭环）</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>域</th>
              <th>业务操作</th>
              <th>目标</th>
              <th>角色</th>
              <th>前置条件</th>
              <th>操作流程</th>
              <th>成功标准</th>
              <th>异常分支</th>
              <th>接口</th>
              <th>状态变化</th>
              <th>异步任务</th>
              <th>证据</th>
            </tr>
          </thead>
          <tbody id="business"></tbody>
        </table>
      </div>
    </section>
    <p class="footer">该页是迁移第一版功能分析的“流程基线”，可直接用于拆解 Java 服务与 React 页面任务。</p>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('hero').innerHTML = hero('flow-analysis.html', '把交互流程与业务操作流程直接纳入功能分析主文档。');
    const q = document.getElementById('q');
    const domain = document.getElementById('domain');
    const stats = document.getElementById('stats');
    const interaction = document.getElementById('interaction');
    const business = document.getElementById('business');

    function render() {
      const s = q.value.trim().toLowerCase();
      const d = domain.value;
      const iRows = (window.INTERACTION_FLOWS || [])
        .filter(x => d === 'all' || x.d === d)
        .filter(x => JSON.stringify(x).toLowerCase().includes(s));
      const bRows = (window.BUSINESS_OPERATION_FLOWS || [])
        .filter(x => d === 'all' || x.d === d)
        .filter(x => JSON.stringify(x).toLowerCase().includes(s));

      stats.innerHTML = `
        <span class="kpi">交互流程：${iRows.length}</span>
        <span class="kpi">业务流程：${bRows.length}</span>
      `;

      interaction.innerHTML = iRows.map(x => `<article class="flow">
        <h4>${x.id} · ${x.name}</h4>
        <div class="meta"><span class="badge">${x.d}</span><span class="badge">${x.actor}</span><span class="badge">${x.risk}风险</span></div>
        <div class="line"><b>入口：</b><code>${x.entry}</code></div>
        <div class="line"><b>步骤：</b><ol>${x.steps.map(k => `<li>${k}</li>`).join('')}</ol></div>
        <div class="line"><b>UI校验：</b>${x.uiCheck}</div>
        <div class="line"><b>接口链：</b><code>${x.apiChain}</code></div>
        <div class="line"><b>状态变化：</b>${x.stateChange}</div>
        <div class="line"><b>异步：</b>${x.async}</div>
        <div class="line"><b>证据：</b>${x.evidence ? `<code>${x.evidence}</code>` : '待补'}</div>
      </article>`).join('');

      business.innerHTML = bRows.map(x => `<tr>
        <td>${x.d}</td>
        <td>${x.operation}</td>
        <td>${x.objective}</td>
        <td>${x.actor}</td>
        <td>${x.preconditions}</td>
        <td><ol>${x.process.map(k => `<li>${k}</li>`).join('')}</ol></td>
        <td>${x.success}</td>
        <td>${x.exceptions}</td>
        <td><code>${x.api}</code></td>
        <td>${x.state}</td>
        <td>${x.jobs}</td>
        <td>${x.evidence ? `<code>${x.evidence}</code>` : '待补'}</td>
      </tr>`).join('');
    }

    q.addEventListener('input', render);
    domain.addEventListener('change', render);
    render();
  </script>
</body>
</html>
